// ==========================================================================
// 2. SAFE STRING & ESCAPING HELPERS (CLASSIC STRING CONCATENATION ONLY)
// ==========================================================================
function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeGet(val, fallback) {
  if (val === null || val === undefined || String(val).trim() === '') {
    return fallback !== undefined ? fallback : '';
  }
  return String(val);
}

/**
 * Automatically converts Google Drive viewer/sharing URLs into direct CDN image URLs
 */
function formatDirectImageUrl(url) {
  if (url === null || url === undefined || String(url).trim() === '') return '';
  var str = String(url).trim();
  // Check for Google Drive file link: /file/d/FILE_ID
  var match = str.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (match && match[1]) {
    return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1200';
  }
  // Check for Google Drive query param link: ?id=FILE_ID or &id=FILE_ID
  var matchId = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (matchId && matchId[1] && str.indexOf('drive.google.com') !== -1) {
    return 'https://drive.google.com/thumbnail?id=' + matchId[1] + '&sz=w1200';
  }
  return str;
}

// ==========================================================================
// 3. TOAST NOTIFICATIONS
// ==========================================================================
function showToast(message, type) {
  var container = document.getElementById('toast-container');
  if (!container) return;

  var toastType = type || 'info';
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + toastType;

  var icon = '✨';
  if (toastType === 'success') icon = '✅';
  if (toastType === 'error') icon = '⚠️';

  toast.innerHTML = '<span>' + icon + '</span><span>' + escapeHtml(message) + '</span>';
  container.appendChild(toast);

  setTimeout(function() {
    toast.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    setTimeout(function() {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 400);
  }, 3500);
}

// ==========================================================================
// 4. GOOGLE SCRIPT API SAFE CALLER (WITH GEMINI CANVAS FALLBACK)
// ==========================================================================
function isGasAvailable() {
  return typeof google !== 'undefined' && google.script && google.script.run;
}

function callBackend(funcName, args, onSuccess, onFailure) {
  if (isGasAvailable()) {
    var runner = google.script.run
      .withSuccessHandler(function(res) {
        if (typeof onSuccess === 'function') onSuccess(res);
      })
      .withFailureHandler(function(err) {
        console.error('GAS Backend Error in ' + funcName + ':', err);
        showToast('Backend Error: ' + (err.message || err), 'error');
        if (typeof onFailure === 'function') onFailure(err);
      });

    if (runner[funcName]) {
      runner[funcName].apply(runner, args || []);
    } else {
      console.warn('Backend function ' + funcName + ' not found on google.script.run.');
      if (typeof onFailure === 'function') {
        onFailure(new Error('Function ' + funcName + ' not found on backend.'));
      }
    }
  } else {
    // Canvas / Local Mode Fallback
    console.log('[Local / Canvas Mode] Emulating backend call to: ' + funcName, args);
    setTimeout(function() {
      var mockResult = emulateLocalBackend(funcName, args);
      if (typeof onSuccess === 'function') onSuccess(mockResult);
    }, 200);
  }
}

/**
 * Local simulation when Google Apps Script is not present (e.g. Gemini Canvas preview)
 */
function emulateLocalBackend(funcName, args) {
  if (funcName === 'getAllAppData') {
    return {
      success: true,
      data: {
        profile: AppState.profile,
        services: AppState.services,
        process: AppState.process,
        portfolio: {
          items: AppState.portfolio.slice(0, 6),
          totalItems: AppState.portfolio.length,
          totalPages: Math.ceil(AppState.portfolio.length / 6),
          currentPage: 1
        },
        blogs: {
          items: AppState.blogs.slice(0, 6),
          totalItems: AppState.blogs.length,
          totalPages: Math.ceil(AppState.blogs.length / 6),
          currentPage: 1
        },
        testimonials: AppState.testimonials,
        clients: AppState.clients
      }
    };
  } else if (funcName === 'verifyAdminPassword') {
    var pin = (args && args[0]) ? String(args[0]).trim() : '';
    if (pin === AppState.profile.AdminPIN) {
      return { success: true, message: 'Authenticated successfully.' };
    }
    return { success: false, message: 'Invalid Admin PIN.' };
  } else if (funcName === 'updateProfileConfig') {
    var cfg = args[0] || {};
    for (var k in cfg) {
      if (cfg.hasOwnProperty(k)) {
        AppState.profile[k] = String(cfg[k]);
      }
    }
    return { success: true, message: 'Profile updated.' };
  } else if (funcName === 'submitContactMessage') {
    var msg = args[0] || {};
    var now = new Date();
    var y = now.getFullYear();
    var m = ('0' + (now.getMonth() + 1)).slice(-2);
    var d = ('0' + now.getDate()).slice(-2);
    var todayStr = '' + y + m + d;
    var nextSeq = ('000' + (AppState.messages.length + 1)).slice(-4);
    var msgId = 'MSG-' + todayStr + '-' + nextSeq;

    var record = {
      MessageID: msgId,
      Timestamp: now.toISOString().replace('T', ' ').substring(0, 19),
      SenderName: msg.SenderName,
      SenderEmail: msg.SenderEmail,
      Subject: msg.Subject,
      MessageText: msg.MessageText,
      Status: 'New'
    };
    AppState.messages.unshift(record);
    return {
      success: true,
      message: 'Message sent! Sequential ID: ' + msgId,
      messageId: msgId
    };
  } else if (funcName === 'getMessagesList') {
    return {
      success: true,
      items: AppState.messages,
      totalItems: AppState.messages.length,
      totalPages: 1,
      currentPage: 1
    };
  } else if (funcName === 'updateMessageStatus') {
    var targetId = args[0];
    var status = args[1];
    for (var i = 0; i < AppState.messages.length; i++) {
      if (AppState.messages[i].MessageID === targetId) {
        AppState.messages[i].Status = status;
        break;
      }
    }
    return { success: true, message: 'Status updated.' };
  } else if (funcName === 'uploadImageToDrive') {
    var b64 = (args && args[0]) ? args[0] : '';
    return { success: true, url: b64, message: 'Local upload simulated.' };
  } else if (funcName.indexOf('save') === 0) {
    return { success: true, message: 'Saved successfully.' };
  } else if (funcName.indexOf('delete') === 0) {
    return { success: true, message: 'Deleted successfully.' };
  }
  return { success: true };
}

/**

function renderProcessGrid() {
  var grid = document.getElementById('process-grid');
  if (!grid) return;

  var items = AppState.process || [];
  var html = '';

  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var stepNum = ('0' + safeGet(it.StepNumber, i + 1)).slice(-2);
    var iconSymbol = '⚡';
    if (it.Icon === 'compass') iconSymbol = '🧭';
    if (it.Icon === 'cpu') iconSymbol = '⚙️';
    if (it.Icon === 'pen-tool') iconSymbol = '✍️';
    if (it.Icon === 'rocket') iconSymbol = '🚀';

    html += '<div class="process-card">';
    html +=   '<span class="process-step-pill">STEP ' + escapeHtml(stepNum) + '</span>';
    html +=   '<div class="process-icon-box">' + iconSymbol + '</div>';
    html +=   '<h3 class="process-title">' + escapeHtml(it.Title) + '</h3>';
    html +=   '<p class="process-desc">' + escapeHtml(it.Description) + '</p>';
    if (AppState.isAdmin) {
      html += '<div style="margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--border-light);">';
      html +=   '<button type="button" class="btn btn-sm btn-outline" onclick="openItemEditor(\'Process\', \'' + escapeHtml(it.ProcessID) + '\')">✏️ Edit Step</button>';
      html += '</div>';
    }
    html += '</div>';
  }

  grid.innerHTML = html;
}

  var allItems = AppState.portfolio || [];
  var cat = AppState.currentCategory;
  var kw = AppState.searchKeyword.toLowerCase().trim();

  var filtered = [];
  for (var i = 0; i < allItems.length; i++) {
    var it = allItems[i];
    var matchCat = (cat === 'All' || it.Category === cat);
    var matchKw = true;
    if (kw) {
      var t = (it.Title || '').toLowerCase();
      var s = (it.Summary || '').toLowerCase();
      var d = (it.DetailContent || '').toLowerCase();
      matchKw = (t.indexOf(kw) !== -1 || s.indexOf(kw) !== -1 || d.indexOf(kw) !== -1);

function renderPaginationControls(containerId, totalPages, currentPage, callbackName) {
  var container = document.getElementById(containerId);
  if (!container) return;

  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }

  var html = '';
  var prevDisabled = (currentPage === 1) ? ' disabled' : '';
  html += '<button type="button" class="page-btn"' + prevDisabled + ' onclick="' + callbackName + '(' + (currentPage - 1) + ')">‹</button>';

  for (var p = 1; p <= totalPages; p++) {
    var activeClass = (p === currentPage) ? ' active' : '';
    html += '<button type="button" class="page-btn' + activeClass + '" onclick="' + callbackName + '(' + p + ')">' + p + '</button>';
  }

  var nextDisabled = (currentPage === totalPages) ? ' disabled' : '';
  html += '<button type="button" class="page-btn"' + nextDisabled + ' onclick="' + callbackName + '(' + (currentPage + 1) + ')">›</button>';

  container.innerHTML = html;
}

function handleContactFormSubmit(e) {
  e.preventDefault();

  var nameVal = document.getElementById('contact-name').value.trim();
  var emailVal = document.getElementById('contact-email').value.trim();
  var subjectVal = document.getElementById('contact-subject').value.trim();
  var messageVal = document.getElementById('contact-message').value.trim();
  var feedbackEl = document.getElementById('contact-form-feedback');
  var submitBtn = document.getElementById('btn-submit-message');

  if (!nameVal || !emailVal || !messageVal) {
    showToast('Please fill in all required fields.', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span>Sending Message...</span>';

  // Safe data extraction into primitive values
  var payload = {
    SenderName: String(nameVal),
    SenderEmail: String(emailVal),
    Subject: String(subjectVal),
    MessageText: String(messageVal)
  };

  callBackend('submitContactMessage', [payload], function(res) {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<span>Send Message to Archana</span>';

    if (res && res.success) {
      document.getElementById('contact-form').reset();
      feedbackEl.style.display = 'block';
      feedbackEl.style.color = '#10b981';
      feedbackEl.textContent = 'Thank you, ' + nameVal + '! Your message has been sent. Reference ID: ' + (res.messageId || 'MSG-SAVED');
      showToast('Message sent! ID: ' + (res.messageId || 'Success'), 'success');
    } else {
      feedbackEl.style.display = 'block';
      feedbackEl.style.color = '#ef4444';
      feedbackEl.textContent = 'Error sending message: ' + (res.message || 'Unknown error');
      showToast('Error sending message.', 'error');
    }
  }, function(err) {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<span>Send Message to Archana</span>';
    feedbackEl.style.display = 'block';
    feedbackEl.style.color = '#ef4444';
    feedbackEl.textContent = 'Server connection failed.';
  });
}

// ==========================================================================
// UNIVERSAL IMAGE UPLOADER & CANVAS COMPRESSION (DEVICE TO GOOGLE DRIVE)
// ==========================================================================
function compressImageFile(file, maxWidth, maxHeight, quality, callback) {
  if (!file) return callback(new Error("No file provided"));
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var maxW = maxWidth || 1200;
      var maxH = maxHeight || 1200;
      var w = img.width;
      var h = img.height;

      if (w > maxW || h > maxH) {
        var ratio = Math.min(maxW / w, maxH / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }

      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      var compressedBase64 = canvas.toDataURL('image/jpeg', quality || 0.82);
      callback(null, compressedBase64);
    };
    img.onerror = function() {
      callback(new Error("Gagal membaca gambar"));
    };
    img.src = e.target.result;
  };
  reader.onerror = function(err) {
    callback(err);
  };
  reader.readAsDataURL(file);
}

function handleProfileFileSelected(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;

  var statusEl = document.getElementById('cms-profile-status');
  var thumb = document.getElementById('cms-profile-thumb');
  var inputEl = document.getElementById('cms-profile-img');
  var saveBtn = document.getElementById('btn-save-profile');

  // Instant local preview
  var tempReader = new FileReader();
  tempReader.onload = function(ev) {
    if (thumb) thumb.src = ev.target.result;
  };
  tempReader.readAsDataURL(file);

  if (statusEl) {
    statusEl.className = 'image-uploader-status uploading';
    statusEl.textContent = 'Mengompresi & mengunggah ke Google Drive...';
  }
  if (saveBtn) saveBtn.disabled = true;

  compressImageFile(file, 1200, 1200, 0.82, function(err, compressedBase64) {
    if (err) {
      if (statusEl) {
        statusEl.className = 'image-uploader-status error';
        statusEl.textContent = 'Gagal memproses gambar.';
      }
      if (saveBtn) saveBtn.disabled = false;
      return;
    }

    callBackend('uploadImageToDrive', [compressedBase64, file.name, 'image/jpeg'], function(res) {
      if (saveBtn) saveBtn.disabled = false;
      if (res && res.success && res.url) {
        if (inputEl) inputEl.value = res.url;
        if (thumb) thumb.src = formatDirectImageUrl(res.url);
        if (statusEl) {
          statusEl.className = 'image-uploader-status success';
          statusEl.textContent = '✓ Foto profil siap & tersimpan di Google Drive!';
        }
        showToast('Foto profil berhasil diunggah ke Google Drive!', 'success');
      } else {
        // Fallback: use compressed base64 so user is never stuck
        if (inputEl) inputEl.value = compressedBase64;
        if (thumb) thumb.src = compressedBase64;
        if (statusEl) {
          statusEl.className = 'image-uploader-status success';
          statusEl.textContent = '✓ Foto siap disimpan (Mode Kompresi).';
        }
        showToast('Foto profil siap disimpan!', 'info');
      }
    }, function(backendErr) {
      if (saveBtn) saveBtn.disabled = false;
      if (inputEl) inputEl.value = compressedBase64;
      if (thumb) thumb.src = compressedBase64;
      if (statusEl) {
        statusEl.className = 'image-uploader-status success';
        statusEl.textContent = '✓ Foto siap disimpan (Mode Kompresi).';
      }
      showToast('Foto profil siap disimpan.', 'info');
    });
  });
}

function renderUniversalImageUploadMarkup(targetInputId, label, currentVal, required) {

  var placeholderImg = currentVal || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';

  out +=   '<div class="image-uploader-box" id="box-' + targetInputId + '">';

  out +=             '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>';
  out +=             '<span>Pilih Foto dari Perangkat</span>';

  out +=           '<button type="button" class="image-uploader-url-toggle" onclick="toggleGenericUrlInput(\'' + targetInputId + '\')">Atau input Link URL</button>';

function toggleGenericUrlInput(targetInputId) {
  var inp = document.getElementById(targetInputId);
  if (inp) {
    inp.style.display = (inp.style.display === 'none' || inp.style.display === '') ? 'block' : 'none';
    if (inp.style.display === 'block') inp.focus();
  }
}

function handleGenericFileUpload(e, targetInputId) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;

  var statusEl = document.getElementById('status-' + targetInputId);
  var thumb = document.getElementById('thumb-' + targetInputId);
  var inputEl = document.getElementById(targetInputId);
  var saveBtn = document.getElementById('btn-item-editor-save');

  // Instant local preview
  var tempReader = new FileReader();
  tempReader.onload = function(ev) {
    if (thumb) thumb.src = ev.target.result;
  };
  tempReader.readAsDataURL(file);

  if (statusEl) {
    statusEl.className = 'image-uploader-status uploading';
    statusEl.textContent = 'Mengompresi & mengunggah ke Google Drive...';
  }
  if (saveBtn) saveBtn.disabled = true;

  compressImageFile(file, 1200, 1200, 0.82, function(err, compressedBase64) {
    if (err) {
      if (statusEl) {
        statusEl.className = 'image-uploader-status error';
        statusEl.textContent = 'Gagal memproses gambar.';
      }
      if (saveBtn) saveBtn.disabled = false;
      return;
    }

    callBackend('uploadImageToDrive', [compressedBase64, file.name, 'image/jpeg'], function(res) {
      if (saveBtn) saveBtn.disabled = false;
      if (res && res.success && res.url) {
        if (inputEl) inputEl.value = res.url;
        if (thumb) thumb.src = formatDirectImageUrl(res.url);
        if (statusEl) {
          statusEl.className = 'image-uploader-status success';
          statusEl.textContent = '✓ Gambar siap & tersimpan di Google Drive!';
        }
        showToast('Gambar berhasil diunggah ke Google Drive!', 'success');
      } else {
        if (inputEl) inputEl.value = compressedBase64;
        if (thumb) thumb.src = compressedBase64;
        if (statusEl) {
          statusEl.className = 'image-uploader-status success';
          statusEl.textContent = '✓ Gambar siap disimpan (Mode Kompresi).';
        }
        showToast('Gambar siap disimpan!', 'info');
      }
    }, function(backendErr) {
      if (saveBtn) saveBtn.disabled = false;
      if (inputEl) inputEl.value = compressedBase64;
      if (thumb) thumb.src = compressedBase64;
      if (statusEl) {
        statusEl.className = 'image-uploader-status success';
        statusEl.textContent = '✓ Gambar siap disimpan (Mode Kompresi).';
      }
      showToast('Gambar siap disimpan.', 'info');
    });
  });
}

function handleItemEditorSubmit(e) {
  e.preventDefault();
  var entity = currentEditorEntity;
  var id = currentEditorId;
  var btn = document.getElementById('btn-item-editor-save');

  btn.disabled = true;
  btn.textContent = 'Saving...';

  // Gather fields into primitive data object
  var payload = {};
  var idKey = entity.substring(0, entity.length - 1) + 'ID';
  if (entity === 'Process') idKey = 'ProcessID';
  if (entity === 'Blogs') idKey = 'BlogID';

  if (id) {
    payload[idKey] = String(id);
  }

  var inputs = document.getElementById('item-editor-fields').querySelectorAll('input, textarea, select');
  for (var i = 0; i < inputs.length; i++) {
    var field = inputs[i];
    if (field.type === 'file') continue;
    var fieldKey = field.id.replace('edit-', '');
    payload[fieldKey] = String(field.value).trim();
  }

  // Determine backend save function name
  var saveFuncName = 'save' + entity.substring(0, entity.length - 1) + 'Item';
  if (entity === 'Process') saveFuncName = 'saveProcessItem';
  if (entity === 'Blogs') saveFuncName = 'saveBlogItem';
  if (entity === 'Services') saveFuncName = 'saveServiceItem';
  if (entity === 'Testimonials') saveFuncName = 'saveTestimonialItem';
  if (entity === 'Clients') saveFuncName = 'saveClientItem';

  // Optimistic UI local array update
  var targetList = null;
  if (entity === 'Portfolio') targetList = AppState.portfolio;
  if (entity === 'Blogs') targetList = AppState.blogs;
  if (entity === 'Services') targetList = AppState.services;
  if (entity === 'Process') targetList = AppState.process;
  if (entity === 'Testimonials') targetList = AppState.testimonials;
  if (entity === 'Clients') targetList = AppState.clients;

  var existingIdx = -1;
  if (id && targetList) {
    for (var t = 0; t < targetList.length; t++) {
      if (targetList[t][idKey] === id || targetList[t].PortfolioID === id || targetList[t].ServiceID === id || targetList[t].ClientID === id || targetList[t].TestimonialID === id) {
        existingIdx = t;
        break;
      }
    }
  }

  if (existingIdx !== -1) {
    targetList[existingIdx] = Object.assign({}, targetList[existingIdx], payload);
  } else if (targetList) {
    if (!payload[idKey]) payload[idKey] = entity.substring(0, 3).toUpperCase() + '-' + Date.now();
    targetList.push(payload);
  }

  // Render view immediately (Optimistic UI)
  renderAllViews();
  if (entity === 'Portfolio') loadCmsPortfolioTable();
  if (entity === 'Blogs') loadCmsBlogsTable();
  if (entity === 'Services') loadCmsServicesTable();
  if (entity === 'Process') loadCmsProcessTable();
  if (entity === 'Testimonials') loadCmsTestimonialsTable();
  if (entity === 'Clients') loadCmsClientsTable();

  callBackend(saveFuncName, [payload], function(res) {
    btn.disabled = false;
    btn.textContent = 'Save Item';
    closeItemEditor();
    showToast(entity + ' item saved & synced to Google Sheets!', 'success');
  }, function() {
    btn.disabled = false;
    btn.textContent = 'Save Item';
  });
}

function deleteCmsItem(entity, id) {
  if (!confirm('Are you sure you want to delete ' + entity + ' item ' + id + '?')) {
    return;
  }

  var deleteFuncName = 'delete' + entity.substring(0, entity.length - 1) + 'Item';
  if (entity === 'Process') deleteFuncName = 'deleteProcessItem';
  if (entity === 'Blogs') deleteFuncName = 'deleteBlogItem';
  if (entity === 'Services') deleteFuncName = 'deleteServiceItem';
  if (entity === 'Testimonials') deleteFuncName = 'deleteTestimonialItem';
  if (entity === 'Clients') deleteFuncName = 'deleteClientItem';

  // Optimistic UI local removal
  var targetList = null;
  if (entity === 'Portfolio') targetList = AppState.portfolio;
  if (entity === 'Blogs') targetList = AppState.blogs;
  if (entity === 'Services') targetList = AppState.services;
  if (entity === 'Process') targetList = AppState.process;
  if (entity === 'Testimonials') targetList = AppState.testimonials;
  if (entity === 'Clients') targetList = AppState.clients;

  if (targetList) {
    for (var i = 0; i < targetList.length; i++) {
      var it = targetList[i];
      if (it.PortfolioID === id || it.BlogID === id || it.ServiceID === id || it.ProcessID === id || it.TestimonialID === id || it.ClientID === id) {
        targetList.splice(i, 1);
        break;
      }
    }
  }

  renderAllViews();
  if (entity === 'Portfolio') loadCmsPortfolioTable();
  if (entity === 'Blogs') loadCmsBlogsTable();
  if (entity === 'Services') loadCmsServicesTable();
  if (entity === 'Process') loadCmsProcessTable();
  if (entity === 'Testimonials') loadCmsTestimonialsTable();
  if (entity === 'Clients') loadCmsClientsTable();

  callBackend(deleteFuncName, [id], function(res) {
    showToast(entity + ' item deleted successfully from Google Sheets.', 'info');
  });
}

// ==========================================================================
// 12. NAVIGATION & RESPONSIVE TOGGLE
// ==========================================================================
function toggleMobileMenu() {
  var nav = document.getElementById('nav-links');
  if (nav) nav.classList.toggle('active');
}

function initNavigationScrollSpy() {
  var links = document.querySelectorAll('.nav-links .nav-link');
  for (var i = 0; i < links.length; i++) {
    links[i].addEventListener('click', function() {
      var nav = document.getElementById('nav-links');
      if (nav) nav.classList.remove('active');
    });
  }

  window.addEventListener('scroll', function() {
    var scrollPos = window.scrollY + 100;
    var sections = ['hero', 'about', 'process', 'portfolio', 'blog', 'services', 'testimonials', 'contact'];

    for (var s = 0; s < sections.length; s++) {
      var sec = document.getElementById(sections[s]);
      if (sec) {
        var top = sec.offsetTop;
        var height = sec.offsetHeight;
        if (scrollPos >= top && scrollPos < top + height) {
          for (var l = 0; l < links.length; l++) {
            if (links[l].getAttribute('href') === '#' + sections[s]) {
              links[l].classList.add('active');
            } else {
              links[l].classList.remove('active');
            }
          }
        }
      }
    }
  });
}
</script>
